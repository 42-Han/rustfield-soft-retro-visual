<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rustfield · 16:9 起始模板</title>
    <style>
      :root { --blue:#31589e; --pink:#f08ab7; --pink-deep:#8e2e5b; --pink-soft:#ffe0ec; --ink:#1e2635; --muted:#62718a; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; color:var(--ink); font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; background:radial-gradient(circle at 84% 78%,rgb(240 138 183 / .24),transparent 23rem),radial-gradient(rgb(49 88 158 / .13) 1px,transparent 1px) 0 0/16px 16px,#f8f7f3; }
      .screen { width:min(94vw,1280px); aspect-ratio:16 / 9; padding:8px; border:2px solid #626873; background:linear-gradient(135deg,#fafafa,#d7d9dd 40%,#a7abb3); box-shadow:inset 2px 2px #fff,inset -3px -3px rgb(76 81 91 / .55),10px 10px 0 rgb(91 96 106 / .6); animation:window-enter 180ms cubic-bezier(.2,.8,.2,1) both; }
      .titlebar { height:clamp(34px,4vw,48px); display:flex; align-items:center; justify-content:space-between; padding:0 15px; color:#fff; border:1.5px solid var(--ink); background:var(--blue); font-size:clamp(10px,1vw,13px); font-weight:800; letter-spacing:.11em; }
      .controls { display:flex; gap:5px; } .control { width:18px; height:18px; display:grid; place-items:center; color:var(--ink); border:1px solid var(--ink); background:linear-gradient(135deg,#fff,#bcc1cc); font-size:12px; font-style:normal; }
      .stage { position:relative; height:calc(100% - clamp(34px,4vw,48px)); overflow:hidden; padding:clamp(26px,4vw,60px); border:1px solid rgb(30 38 53 / .32); background:radial-gradient(circle at 91% 14%,rgb(240 138 183 / .2),transparent 17rem),linear-gradient(135deg,rgb(220 235 255 / .8),rgb(255 255 255 / .98) 54%,rgb(255 224 236 / .72)); }
      .stage::after { position:absolute; inset:0; pointer-events:none; opacity:.38; background:radial-gradient(rgb(49 88 158 / .18) 1px,transparent 1px) 0 0/15px 15px; mask-image:linear-gradient(90deg,#000 0 62%,transparent 94%); content:""; }
      .content { position:relative; z-index:1; height:100%; display:grid; grid-template-columns:minmax(0,1.07fr) minmax(280px,.93fr); grid-template-rows:auto 1fr auto; gap:clamp(18px,2.6vw,34px); }
      .copy { grid-column:1 / -1; max-width:940px; align-self:start; animation:text-in 180ms ease-out 60ms both; }
      .eyebrow { margin:0; color:var(--blue); font-size:clamp(9px,1vw,12px); font-weight:800; letter-spacing:.13em; }
      h1 { max-width:940px; margin:10px 0 12px; font-size:clamp(34px,5.1vw,76px); line-height:.95; letter-spacing:-.075em; }
      h1 mark { color:var(--ink); background:linear-gradient(transparent 54%,var(--pink) 54% 89%,transparent 89%); }
      .lead { max-width:620px; margin:0; color:var(--muted); font-size:clamp(14px,1.5vw,20px); line-height:1.4; }
      .mechanism { grid-column:1 / -1; align-self:end; min-height:150px; padding:clamp(16px,2vw,24px); border:1px solid #8591a4; background:rgb(255 255 255 / .78); box-shadow:5px 6px 0 rgb(49 88 158 / .13),inset 1px 1px #fff; animation:text-in 180ms ease-out 120ms both; }
      .mechanism-head { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:20px; padding-bottom:9px; border-bottom:1px solid rgb(49 88 158 / .24); }
      .mechanism-head strong { color:var(--blue); font-size:clamp(10px,1vw,13px); letter-spacing:.1em; } .mechanism-head span { color:var(--muted); font-size:12px; }
      .rail { display:flex; align-items:center; gap:clamp(8px,1.2vw,16px); }
      .step { position:relative; flex:1; min-width:0; padding:11px 13px; border:1.5px solid #819bd0; border-radius:8px; background:#f7faff; font-size:clamp(11px,1.25vw,16px); font-weight:800; white-space:nowrap; }
      .step::before { display:inline-grid; width:22px; height:22px; margin-right:8px; place-items:center; color:var(--blue); border:1px solid currentColor; border-radius:50%; font-size:10px; content:attr(data-step); vertical-align:middle; }
      .step.current { color:var(--pink-deep); border-color:#d96f9e; background:var(--pink-soft); } .step.current::before { color:var(--pink-deep); background:var(--pink); }
      .step:not(:last-child)::after { position:absolute; top:50%; left:calc(100% + 5px); width:clamp(8px,1.4vw,24px); height:1px; background:#819bd0; content:""; }
      .accent-slot { position:absolute; right:clamp(26px,5vw,78px); top:clamp(26px,4vw,58px); width:130px; min-height:76px; display:grid; place-items:center; color:var(--pink-deep); border-top:2px solid var(--pink); border-bottom:1px solid rgb(217 111 158 / .5); font-size:10px; font-weight:800; letter-spacing:.08em; text-align:center; transform:rotate(3deg); animation:soft-float 8s ease-in-out infinite; }
      .footer-note { grid-column:1 / -1; align-self:end; margin:0; color:var(--pink-deep); font-size:11px; font-weight:800; letter-spacing:.04em; }
      @keyframes window-enter { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      @keyframes text-in { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
      @keyframes soft-float { 0%,100% { transform:translateY(6px) rotate(3deg); } 50% { transform:translateY(-6px) rotate(3deg); } }
      @media (max-width:760px) { .content { grid-template-columns:1fr; grid-template-rows:auto auto 1fr auto; } .accent-slot { right:22px; top:24px; width:90px; min-height:52px; } .mechanism { grid-column:1; } .footer-note { grid-column:1; } .rail { flex-wrap:wrap; } .step { flex-basis:calc(50% - 8px); } .step:not(:last-child)::after { display:none; } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; scroll-behavior:auto!important; } }
    </style>
  </head>
  <body>
    <main class="screen">
      <header class="titlebar"><span>RUSTFIELD_VISUAL / EPISODE_01</span><span class="controls"><i class="control">−</i><i class="control">□</i><i class="control">×</i></span></header>
      <section class="stage">
        <div class="content">
          <div class="copy">
            <p class="eyebrow">01 / 先写这一页唯一的观点</p>
            <h1>把主标题放在<br /><mark>观众最先看到的位置。</mark></h1>
            <p class="lead">替换这句辅助说明。它只负责解释主标题，不要在这里提前塞入第二套信息结构。</p>
          </div>
          <div class="accent-slot">OPTIONAL<br />SEMANTIC OBJECT<br />0—1 个</div>
          <section class="mechanism" aria-label="主要机制插槽">
            <div class="mechanism-head"><strong>MECHANISM_SLOT / 主要机制</strong><span>把这里替换为流程、决策、对比、证据或数据</span></div>
            <div class="rail"><div class="step current" data-step="01">定义主题</div><div class="step" data-step="02">拆解参考</div><div class="step" data-step="03">生成结果</div></div>
          </section>
          <p class="footer-note">一屏一个主观点 · 粉色只标记重点 · 点睛物必须有理由</p>
        </div>
      </section>
    </main>
  </body>
</html>
