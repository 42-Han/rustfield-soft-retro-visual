<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rustfield · 决策树</title>
    <style>
      :root { --blue:#31589e; --blue-soft:#dcebff; --pink:#f08ab7; --pink-soft:#ffe0ec; --ink:#1e2635; --paper:#fff; } *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);font-family:Arial,"PingFang SC",sans-serif;background:radial-gradient(circle at 15% 75%,rgb(240 138 183 / .23),transparent 22rem),radial-gradient(rgb(49 88 158 / .13) 1px,transparent 1px) 0 0/16px 16px,#f8f7f3}.screen{width:min(94vw,1280px);aspect-ratio:16/9;padding:8px;border:2px solid #626873;background:linear-gradient(135deg,#fafafa,#d7d9dd 40%,#a7abb3);box-shadow:inset 2px 2px #fff,inset -3px -3px rgb(76 81 91 / .55),10px 10px 0 rgb(91 96 106 / .6)}.titlebar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;border:1.5px solid var(--ink);background:var(--blue);font-size:13px;font-weight:800;letter-spacing:.11em}.controls{display:flex;gap:5px}.control{width:18px;height:18px;display:grid;place-items:center;color:var(--ink);border:1px solid var(--ink);background:linear-gradient(135deg,#fff,#bcc1cc);font-size:12px}.stage{position:relative;height:calc(100% - 48px);padding:clamp(28px,4vw,60px);overflow:hidden;border:1px solid rgb(30 38 53 / .32);background:linear-gradient(135deg,rgb(220 235 255 / .75),rgb(255 255 255 / .98) 54%,rgb(255 224 236 / .72))}.kicker{margin:0;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.headline{margin:10px 0 0;font-size:clamp(32px,4vw,57px);line-height:1;letter-spacing:-.06em}.tree{position:relative;height:70%;margin-top:24px}.tree-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.tree-lines path{fill:none;stroke:#7392c8;stroke-width:2}.tree-lines .active-path{stroke:var(--pink);stroke-width:4;stroke-dasharray:9 7;animation:dash 1.5s linear infinite}.node{position:absolute;z-index:1;padding:15px 18px;border:1.5px solid var(--ink);background:var(--paper);box-shadow:4px 4px 0 rgb(49 88 158 / .19);font-weight:800}.node small{display:block;margin-bottom:5px;color:var(--blue);font-size:11px;letter-spacing:.08em}.root{top:0;left:50%;width:250px;transform:translateX(-50%);background:var(--blue);color:#fff}.root small{color:#dcebff}.branch{top:53%;width:27%;min-height:92px}.branch-a{left:3%}.branch-b{left:36.5%;border-color:var(--pink);background:var(--pink-soft);box-shadow:5px 5px 0 rgb(240 138 183 / .28)}.branch-c{right:3%}.result{position:absolute;right:4%;bottom:2%;padding:7px 11px;color:#8e2e5b;border:1px solid #d96f9e;background:#fff;font-size:12px;font-weight:800}@keyframes dash{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
      /* 圆角是一套统一语言；只有根问题与当前路径承担更强的结构重量。 */
      .tree .node { border-width:1.5px; border-radius:13px; box-shadow:3px 4px 0 rgb(49 88 158 / .13),inset 1px 1px rgb(255 255 255 / .78); }
      .tree .root { border-width:2px; border-radius:13px; box-shadow:4px 5px 0 rgb(49 88 158 / .20),inset 1px 1px rgb(255 255 255 / .18); }
      .tree .branch-b { border-width:3px; border-radius:13px; box-shadow:4px 5px 0 rgb(240 138 183 / .22),inset 1px 1px rgb(255 255 255 / .72); }
    </style>
  </head>
  <body><main class="screen"><header class="titlebar"><span>MODEL_DECISION / EPISODE_02</span><span class="controls"><i class="control">−</i><i class="control">□</i><i class="control">×</i></span></header><section class="stage"><p class="kicker">02 / 工具选择，不靠直觉</p><h1 class="headline">你这一步，<br />到底该选哪个模型？</h1><div class="tree"><svg class="tree-lines" viewBox="0 0 1000 430" preserveAspectRatio="none" aria-hidden="true"><path d="M500 75 V185 H175 V240"/><path class="active-path" d="M500 75 V185 H500 V240"/><path d="M500 75 V185 H825 V240"/></svg><article class="node root"><small>ROOT QUESTION</small>你要先解决的是风格统一，还是动作与镜头？</article><article class="node branch branch-a"><small>路径 A</small>先拆参考<br />建立风格锚点</article><article class="node branch branch-b"><small>路径 B / 当前</small>先做镜头实验<br />验证动作可能性</article><article class="node branch branch-c"><small>路径 C</small>先找工具限制<br />再回到提示词</article><span class="result">粉色只表示当前判断路径</span></div></section></main></body>
</html>
