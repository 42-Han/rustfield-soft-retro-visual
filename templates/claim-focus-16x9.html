<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rustfield · 主张与结论</title>
    <style>
      :root { --blue:#31589e; --blue-soft:#dcebff; --pink:#f08ab7; --pink-soft:#ffe0ec; --ink:#1e2635; --paper:#fff; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); font-family:Arial,"PingFang SC",sans-serif; background:radial-gradient(circle at 83% 76%,rgb(240 138 183 / .25),transparent 24rem),radial-gradient(rgb(49 88 158 / .13) 1px,transparent 1px) 0 0/16px 16px,#f8f7f3; }
      .screen { width:min(94vw,1280px); aspect-ratio:16/9; padding:8px; border:2px solid #626873; background:linear-gradient(135deg,#fafafa,#d7d9dd 40%,#a7abb3); box-shadow:inset 2px 2px #fff,inset -3px -3px rgb(76 81 91 / .55),10px 10px 0 rgb(91 96 106 / .6); }
      .titlebar { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; color:#fff; border:1.5px solid var(--ink); background:var(--blue); font-size:13px; font-weight:800; letter-spacing:.11em; }
      .controls { display:flex; gap:5px; } .control { width:18px; height:18px; display:grid; place-items:center; color:var(--ink); border:1px solid var(--ink); background:linear-gradient(135deg,#fff,#bcc1cc); font-size:12px; }
      .stage { position:relative; height:calc(100% - 48px); overflow:hidden; padding:clamp(34px,5vw,76px); border:1px solid rgb(30 38 53 / .32); background:radial-gradient(circle at 91% 82%,rgb(240 138 183 / .28),transparent 18rem),linear-gradient(135deg,rgb(220 235 255 / .78),rgb(255 255 255 / .98) 52%,rgb(255 224 236 / .72)); }
      .eyebrow { display:inline-block; margin:0; padding:7px 10px; color:#8e2e5b; border:1px solid #d96f9e; background:var(--pink-soft); box-shadow:3px 3px 0 rgb(240 138 183 / .22); font-size:12px; font-weight:800; letter-spacing:.1em; }
      .claim { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(220px,.7fr); gap:clamp(28px,6vw,92px); align-items:center; min-height:70%; }
      h1 { max-width:820px; margin:24px 0 20px; font-size:clamp(42px,6vw,82px); line-height:.96; letter-spacing:-.075em; animation:claim-in 500ms ease-out both; }
      .mark { padding:0 4px; background:linear-gradient(transparent 48%,rgb(240 138 183 / .72) 48% 90%,transparent 90%); }
      .lead { max-width:650px; margin:0; font-size:clamp(18px,2vw,27px); line-height:1.45; animation:claim-in 500ms 90ms ease-out both; }
      .claim-accent { position:relative; min-height:250px; display:grid; place-items:center; }
      .claim-accent::before { position:absolute; width:190px; height:190px; border:2px solid var(--blue); border-radius:50%; content:""; animation:orbit 18s linear infinite; }
      .claim-accent::after { position:absolute; width:118px; height:118px; border:1px solid var(--pink); border-radius:50%; background:radial-gradient(circle at 32% 28%,#fff 0 5%,transparent 6%),linear-gradient(135deg,var(--pink-soft),var(--blue-soft)); box-shadow:inset 9px 9px 0 rgb(255 255 255 / .42),6px 7px 0 rgb(49 88 158 / .14); content:""; animation:breathe 6s ease-in-out infinite; }
      .claim-word { position:relative; z-index:1; color:#fff; font-size:clamp(24px,3.1vw,42px); font-weight:900; letter-spacing:-.08em; text-shadow:2px 2px 0 #8e2e5b; transform:rotate(-7deg); }
      .claim-caption { position:absolute; right:5%; bottom:3%; padding:7px 10px; color:var(--blue); border-top:2px solid var(--blue); border-bottom:2px solid var(--pink); font-size:11px; font-weight:800; letter-spacing:.12em; }
      @keyframes claim-in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
      @keyframes orbit { to { transform:rotate(360deg); } }
      @keyframes breathe { 50% { transform:scale(1.04); } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; } }
    </style>
  </head>
  <body>
    <main class="screen">
      <header class="titlebar"><span>CLAIM_FOCUS / EPISODE_00</span><span class="controls"><i class="control">−</i><i class="control">□</i><i class="control">×</i></span></header>
      <section class="stage">
        <p class="eyebrow">00 / 先让观众记住一个判断</p>
        <div class="claim">
          <div>
            <h1>好的 AI 视频，<br /><span class="mark">先有判断，再有生成。</span></h1>
            <p class="lead">开场不需要解释所有细节。先把这一页最重要的观点交给观众，后面的流程才有方向。</p>
          </div>
          <div class="claim-accent" aria-label="判断优先的视觉标记"><span class="claim-word">先判断</span><span class="claim-caption">ONE CLEAR POINT</span></div>
        </div>
      </section>
    </main>
  </body>
</html>
