<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rustfield · 数据叙事</title>
    <style>
      :root { --blue:#31589e; --blue-soft:#dcebff; --pink:#f08ab7; --pink-soft:#ffe0ec; --ink:#1e2635; --paper:#fff; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); font-family:Arial,"PingFang SC",sans-serif; background:radial-gradient(circle at 86% 80%,rgb(240 138 183 / .24),transparent 23rem),radial-gradient(rgb(49 88 158 / .13) 1px,transparent 1px) 0 0/16px 16px,#f8f7f3; }
      .screen { width:min(94vw,1280px); aspect-ratio:16/9; padding:8px; border:2px solid #626873; background:linear-gradient(135deg,#fafafa,#d7d9dd 40%,#a7abb3); box-shadow:inset 2px 2px #fff,inset -3px -3px rgb(76 81 91 / .55),10px 10px 0 rgb(91 96 106 / .6); }
      .titlebar { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; color:#fff; border:1.5px solid var(--ink); background:var(--blue); font-size:13px; font-weight:800; letter-spacing:.11em; }
      .controls { display:flex; gap:5px; } .control { width:18px; height:18px; display:grid; place-items:center; color:var(--ink); border:1px solid var(--ink); background:linear-gradient(135deg,#fff,#bcc1cc); font-size:12px; }
      .stage { height:calc(100% - 48px); padding:clamp(28px,4vw,60px); border:1px solid rgb(30 38 53 / .32); background:radial-gradient(circle at 88% 17%,rgb(240 138 183 / .21),transparent 17rem),linear-gradient(135deg,rgb(220 235 255 / .78),rgb(255 255 255 / .98) 54%,rgb(255 224 236 / .72)); }
      .eyebrow { margin:0; color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.11em; }
      h1 { max-width:820px; margin:10px 0 26px; font-size:clamp(34px,4.8vw,66px); line-height:.98; letter-spacing:-.07em; }
      .narrative { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(230px,.7fr); gap:clamp(24px,4vw,60px); align-items:center; }
      .chart-frame { padding:18px 20px 12px; border:2px solid #6f87b6; background:linear-gradient(135deg,#f8fbff,#e7eef8); box-shadow:5px 7px 0 rgb(49 88 158 / .13),0 10px 22px rgb(49 88 158 / .08),inset 1px 1px #fff; }
      .chart-label { display:flex; justify-content:space-between; margin-bottom:8px; color:#59677e; font-size:11px; font-weight:800; letter-spacing:.1em; }
      .chart { display:block; width:100%; height:auto; overflow:visible; }
      .chart .grid { stroke:#b9c9df; stroke-width:1; opacity:.45; } .chart .axis { stroke:#a7b6ca; stroke-width:1.5; } .chart .area { fill:#dcebff; opacity:.42; } .chart .context { fill:none; stroke:#9ab4dc; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; } .chart .trend { fill:none; stroke:#d96f9e; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:650; stroke-dashoffset:650; animation:draw 1.4s ease-out forwards; } .chart .point { fill:#f08ab7; stroke:#fff; stroke-width:3; animation:point-in 1.4s 1s ease-out both; } .chart text { fill:#71809a; font:700 12px Arial,"PingFang SC",sans-serif; }
      .takeaway { padding:25px 24px; border:2px solid #d96f9e; background:linear-gradient(135deg,#fff8fc,#f6c5d9); box-shadow:5px 7px 0 rgb(240 138 183 / .17),0 10px 22px rgb(240 138 183 / .09),inset 1px 1px #fff; }
      .takeaway-tag { color:#8e2e5b; font-size:11px; font-weight:800; letter-spacing:.1em; }
      .takeaway h2 { margin:17px 0 12px; font-size:clamp(26px,3vw,42px); line-height:1; letter-spacing:-.06em; }
      .takeaway p { margin:0; font-size:clamp(16px,1.6vw,22px); line-height:1.45; }
      .source { margin:14px 0 0; color:#59677e; font-size:11px; letter-spacing:.07em; }
      @keyframes draw { to { stroke-dashoffset:0; } } @keyframes point-in { from { opacity:0; transform:scale(.5); transform-origin:center; } to { opacity:1; transform:scale(1); transform-origin:center; } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; } .chart .trend { stroke-dashoffset:0; } }
    </style>
  </head>
  <body>
    <main class="screen">
      <header class="titlebar"><span>DATA_NARRATIVE / EPISODE_06</span><span class="controls"><i class="control">−</i><i class="control">□</i><i class="control">×</i></span></header>
      <section class="stage">
        <p class="eyebrow">06 / 让一个变化，自己说明问题</p>
        <h1>输入越有判断，<br />结果越少随机。</h1>
        <div class="narrative">
          <div class="chart-frame">
            <div class="chart-label"><span>画面稳定度</span><span>审美输入清晰度 →</span></div>
            <svg class="chart" viewBox="0 0 700 270" role="img" aria-label="随着审美输入清晰度提升，画面稳定度上升的趋势图"><path class="grid" d="M70 40H670M70 95H670M70 150H670M70 205H670M170 20V230M270 20V230M370 20V230M470 20V230M570 20V230"/><path class="axis" d="M70 20V230H670"/><path class="area" d="M70 200C145 196 168 182 232 183S327 161 370 160S456 130 510 135S600 111 670 95L670 230H70Z"/><path class="context" d="M70 200C145 196 168 182 232 183S327 161 370 160S456 130 510 135S600 111 670 95"/><path class="trend" d="M70 200C145 196 168 182 232 183S327 161 370 160S456 130 510 135S600 111 670 95"/><circle class="point" cx="510" cy="135" r="9"/><text x="58" y="245">模糊</text><text x="637" y="245">明确</text><text x="520" y="119">可复用区间</text></svg>
            <p class="source">示意图｜把真实数据或观察结果替换进来</p>
          </div>
          <aside class="takeaway"><span class="takeaway-tag">ONE TAKEAWAY</span><h2>先建立语言，<br />再追求变化。</h2><p>当参考、配色和镜头判断变得清楚，生成结果才开始变得可控。</p></aside>
        </div>
      </section>
    </main>
  </body>
</html>
