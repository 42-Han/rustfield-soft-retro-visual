<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rustfield · 对比双窗</title>
    <style>
      :root{--blue:#31589e;--blue-soft:#dcebff;--pink:#f08ab7;--pink-soft:#ffe0ec;--ink:#1e2635;--paper:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);font-family:Arial,"PingFang SC",sans-serif;background:radial-gradient(circle at 85% 75%,rgb(240 138 183 / .25),transparent 23rem),radial-gradient(rgb(49 88 158 / .13) 1px,transparent 1px) 0 0/16px 16px,#f8f7f3}.screen{width:min(94vw,1280px);aspect-ratio:16/9;padding:8px;border:2px solid #626873;background:linear-gradient(135deg,#fafafa,#d7d9dd 40%,#a7abb3);box-shadow:inset 2px 2px #fff,inset -3px -3px rgb(76 81 91 / .55),10px 10px 0 rgb(91 96 106 / .6)}.titlebar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;border:1.5px solid var(--ink);background:var(--blue);font-size:13px;font-weight:800;letter-spacing:.11em}.controls{display:flex;gap:5px}.control{width:18px;height:18px;display:grid;place-items:center;color:var(--ink);border:1px solid var(--ink);background:linear-gradient(135deg,#fff,#bcc1cc);font-size:12px}.stage{height:calc(100% - 48px);padding:clamp(28px,4vw,62px);border:1px solid rgb(30 38 53 / .32);background:linear-gradient(135deg,rgb(220 235 255 / .78),rgb(255 255 255 / .98) 50%,rgb(255 224 236 / .76))}.eyebrow{margin:0;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.11em}h1{margin:10px 0 27px;font-size:clamp(32px,4.3vw,60px);line-height:1;letter-spacing:-.06em}.compare{display:grid;grid-template-columns:1fr 86px 1fr;gap:18px;align-items:center}.panel{min-height:270px;padding:6px;border:2px solid #626873;background:linear-gradient(135deg,#fafafa,#c8cbd1);box-shadow:6px 6px 0 rgb(91 96 106 / .34)}.panel-head{padding:10px 13px;color:#fff;border:1px solid var(--ink);background:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em}.recommended .panel-head{color:var(--ink);background:var(--pink)}.panel-body{min-height:205px;padding:25px;border:1px solid rgb(30 38 53 / .32);background:#fff}.panel-body h2{margin:0 0 15px;font-size:clamp(23px,2.6vw,38px);letter-spacing:-.05em}.panel-body p{max-width:330px;margin:0;font-size:16px;line-height:1.55}.signal{display:grid;width:68px;height:68px;place-items:center;color:#8e2e5b;border:2px solid var(--pink);border-radius:50%;background:var(--pink-soft);box-shadow:4px 4px 0 rgb(240 138 183 / .24);font-size:14px;font-weight:900}.criterion{margin-top:20px;padding:11px 13px;color:#8e2e5b;border:1px solid #d96f9e;background:rgb(255 224 236 / .7);font-size:14px;font-weight:800}
      /* 次级窗口也有机身层次，但不用笨重的灰色硬投影。 */
      .compare .panel { padding:3px; border:2px solid #6f87b6; background:linear-gradient(135deg,#f8fbff,#c8d6ec); box-shadow:5px 7px 0 rgb(49 88 158 / .13),0 10px 22px rgb(49 88 158 / .09),inset 1px 1px #fff; }
      .compare .panel-head { border:1px solid var(--ink); border-bottom:2px solid var(--ink); }
      .compare .panel-body { border:1px solid rgb(30 38 53 / .32); border-top:0; background:#fffdfd; }
      .compare .recommended { border-color:#d96f9e; background:linear-gradient(135deg,#fff8fc,#f6c5d9); box-shadow:5px 7px 0 rgb(240 138 183 / .18),0 10px 22px rgb(240 138 183 / .10),inset 1px 1px #fff; }
      .compare .signal { box-shadow:2px 3px 0 rgb(240 138 183 / .14),inset 1px 1px rgb(255 255 255 / .8); }
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </head>
  <body><main class="screen"><header class="titlebar"><span>STYLE_COMPARE / EPISODE_03</span><span class="controls"><i class="control">−</i><i class="control">□</i><i class="control">×</i></span></header><section class="stage"><p class="eyebrow">03 / 把选择做成可以判断的对比</p><h1>不要问“哪个好”，<br />先问“它解决什么”。</h1><div class="compare"><article class="panel"><header class="panel-head">OPTION A / 先试工具</header><div class="panel-body"><h2>快，但随机。</h2><p>适合快速摸到工具边界；当审美输入还不明确时，画面会更容易漂移。</p></div></article><span class="signal">VS</span><article class="panel recommended"><header class="panel-head">OPTION B / 先定风格</header><div class="panel-body"><h2>慢一点，<br />但能复用。</h2><p>先建立参考、色彩与镜头的共同语言，再进入生成，后续每一步都会更稳定。</p></div></article></div><p class="criterion">判断标准：这一步是否能让后续的选择变得更少、更清楚？</p></section></main></body>
</html>
