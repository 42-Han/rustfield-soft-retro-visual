<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rustfield · 输入输出台</title>
    <style>
      :root{--blue:#31589e;--blue-soft:#dcebff;--pink:#f08ab7;--pink-soft:#ffe0ec;--ink:#1e2635;--paper:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);font-family:Arial,"PingFang SC",sans-serif;background:radial-gradient(circle at 12% 82%,rgb(240 138 183 / .22),transparent 24rem),radial-gradient(rgb(49 88 158 / .13) 1px,transparent 1px) 0 0/16px 16px,#f8f7f3}.screen{width:min(94vw,1280px);aspect-ratio:16/9;padding:8px;border:2px solid #626873;background:linear-gradient(135deg,#fafafa,#d7d9dd 40%,#a7abb3);box-shadow:inset 2px 2px #fff,inset -3px -3px rgb(76 81 91 / .55),10px 10px 0 rgb(91 96 106 / .6)}.titlebar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;border:1.5px solid var(--ink);background:var(--blue);font-size:13px;font-weight:800;letter-spacing:.11em}.controls{display:flex;gap:5px}.control{width:18px;height:18px;display:grid;place-items:center;color:var(--ink);border:1px solid var(--ink);background:linear-gradient(135deg,#fff,#bcc1cc);font-size:12px}.stage{height:calc(100% - 48px);padding:clamp(28px,4vw,62px);border:1px solid rgb(30 38 53 / .32);background:radial-gradient(circle at 92% 80%,rgb(240 138 183 / .26),transparent 17rem),linear-gradient(135deg,rgb(220 235 255 / .78),rgb(255 255 255 / .98) 50%,rgb(255 224 236 / .7))}.eyebrow{margin:0;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.11em}h1{margin:10px 0 26px;font-size:clamp(32px,4.3vw,60px);line-height:1;letter-spacing:-.06em}.desk{display:grid;grid-template-columns:1fr 160px 1fr;gap:20px;align-items:center}.module{min-height:255px;padding:6px;border:2px solid #626873;background:linear-gradient(135deg,#fafafa,#c8cbd1);box-shadow:6px 6px 0 rgb(91 96 106 / .34)}.module-head{padding:10px 13px;color:#fff;border:1px solid var(--ink);background:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em}.module-body{min-height:190px;padding:25px;border:1px solid rgb(30 38 53 / .32);background:#fff}.folder{width:98px;height:67px;margin-bottom:19px;border:2px solid var(--ink);border-radius:4px;background:var(--blue-soft);box-shadow:5px 5px 0 rgb(49 88 158 / .16)}.folder::before{display:block;width:43px;height:12px;transform:translate(-2px,-14px);border:2px solid var(--ink);border-bottom:0;border-radius:4px 4px 0 0;background:var(--pink-soft);content:""}.module h2{margin:0 0 9px;font-size:27px;letter-spacing:-.05em}.module p{margin:0;font-size:15px;line-height:1.55}.transfer{position:relative;height:80px}.transfer::before{position:absolute;top:37px;left:0;width:calc(100% - 14px);height:3px;background:repeating-linear-gradient(90deg,var(--pink) 0 12px,#ffc9dd 12px 20px);background-size:20px 3px;animation:flow 1.4s linear infinite;content:""}.transfer::after{position:absolute;top:30px;right:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:15px solid var(--pink);content:""}.transfer span{position:absolute;top:0;left:50%;transform:translateX(-50%);padding:6px 9px;color:#8e2e5b;border:1px solid #d96f9e;background:var(--pink-soft);font-size:11px;font-weight:800;white-space:nowrap}.output{padding:18px;color:#fff;border:2px solid var(--ink);background:var(--blue);box-shadow:5px 5px 0 rgb(49 88 158 / .19)}.output p{color:#dcebff}@keyframes flow{to{background-position:20px 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
      /* 深蓝只留给最外层标题栏；次级窗口用细边、内高光和柔和环境影塑造质感。 */
      .desk .module { padding:3px; border:2px solid #9298a2; background:linear-gradient(135deg,#fbfbfc,#d8dbe1); box-shadow:5px 7px 0 rgb(49 88 158 / .12),0 11px 24px rgb(49 88 158 / .08),inset 1px 1px #fff; }
      .desk .module-head { color:var(--ink); border:1px solid var(--ink); border-bottom:2px solid var(--ink); background:#d7d9dd; }
      .desk .module-body { border:1px solid rgb(30 38 53 / .32); border-top:0; background:#fffdfd; }
      .desk .module:last-child { border-color:#d96f9e; background:linear-gradient(135deg,#fff8fc,#f6c5d9); box-shadow:5px 7px 0 rgb(240 138 183 / .18),0 11px 24px rgb(240 138 183 / .10),inset 1px 1px #fff; }
      .desk .module:last-child .module-head { background:var(--pink); }
      .desk .output { color:var(--ink); border-color:var(--blue); background:var(--blue-soft); box-shadow:inset 1px 1px rgb(255 255 255 / .72),3px 4px 0 rgb(49 88 158 / .12); }
      .desk .output p { color:var(--ink); }
    </style>
  </head>
  <body><main class="screen"><header class="titlebar"><span>INPUT_OUTPUT / EPISODE_04</span><span class="controls"><i class="control">−</i><i class="control">□</i><i class="control">×</i></span></header><section class="stage"><p class="eyebrow">04 / 把“生成”拆成能看见的转换</p><h1>素材不是丢进模型，<br />而是被你重新组织。</h1><div class="desk"><article class="module"><header class="module-head">INPUT / 审美输入</header><div class="module-body"><div class="folder" aria-hidden="true"></div><h2>参考素材</h2><p>镜头、配色、构图、人物状态。输入越有判断，输出越少随机。</p></div></article><div class="transfer"><span>你在这里做选择</span></div><article class="module"><header class="module-head">OUTPUT / 可控画面</header><div class="module-body"><div class="output"><strong>STYLE LOCKED</strong><p>同一套语言，进入后续生成与剪辑。</p></div><h2 style="margin-top:20px">可复用结果</h2><p>不是一次偶然的好图，而是一套能够继续迭代的视觉判断。</p></div></article></div></section></main></body>
