    <title>Rustfield · App 起始模板</title>
    <style>
      :root { --blue:#31589e; --blue-soft:#dcebff; --pink:#f08ab7; --pink-deep:#8e2e5b; --pink-soft:#ffe0ec; --frame:#c6c8cd; --frame-dark:#626873; --ink:#1e2635; --muted:#62718a; } * { box-sizing:border-box; } body { margin:0; min-height:100vh; padding:18px 0; color:var(--ink); font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; background:radial-gradient(circle at 84% 78%,rgb(240 138 183 / .2),transparent 23rem),radial-gradient(rgb(49 88 158 / .13) 1px,transparent 1px) 0 0/16px 16px,#f8f7f3; } .screen { width:min(94vw,1280px); margin:0 auto; padding:8px; border:2px solid #626873; background:linear-gradient(135deg,#fafafa,#d7d9dd 40%,#a7abb3); box-shadow:inset 2px 2px #fff,inset -3px -3px rgb(76 81 91 / .55),10px 10px 0 rgb(91 96 106 / .5); } .titlebar { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; color:#fff; border:1.5px solid var(--ink); background:var(--blue); font-size:13px; font-weight:900; letter-spacing:.11em; } .controls { display:flex; gap:5px; } .control { display:grid; width:18px; height:18px; place-items:center; color:var(--ink); border:1px solid var(--ink); background:linear-gradient(#fff,#bcc1cc); font-style:normal; } .stage { min-height:680px; padding:clamp(24px,4vw,54px); border:1px solid rgb(30 38 53 / .3); background:linear-gradient(135deg,rgb(220 235 255 / .78),#fff 54%,rgb(255 224 236 / .72)); } .workspace { display:grid; grid-template-columns:230px minmax(0,1fr); min-height:550px; border:2px solid var(--frame-dark); background:rgb(255 255 255 / .82); box-shadow:7px 8px 0 rgb(49 88 158 / .16),inset 2px 2px #fff; } .sidebar { position:relative; overflow:hidden; padding:24px 18px; border-right:1px solid var(--frame-dark); background:linear-gradient(165deg,#f8f8f5 0%,#edf2f9 66%,#f7e7ef 100%); } .sidebar::after { position:absolute; right:-28px; bottom:28px; width:90px; height:90px; border:1px solid rgb(240 138 183 / .5); border-radius:50%; content:""; opacity:.6; } .brand { position:relative; z-index:1; margin:0 0 7px; color:var(--blue); font-size:14px; font-weight:900; letter-spacing:.1em; } .sidebar-kicker { position:relative; z-index:1; margin:0 0 26px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.12em; } .sidebar-nav { position:relative; z-index:1; } .nav-item { display:flex; align-items:center; gap:10px; margin:8px 0; padding:11px 10px; color:var(--muted); border:1px solid transparent; font-size:13px; font-weight:800; text-decoration:none; } .nav-item.active { color:var(--pink-deep); border-color:#d96f9e; border-left-width:3px; background:linear-gradient(90deg,var(--pink-soft),rgb(255 255 255 / .35)); } .nav-number { color:var(--blue); font-size:10px; font-weight:900; letter-spacing:.05em; } .nav-item.active .nav-number { color:var(--pink-deep); } .work-area { padding:36px 34px 28px; } .work-head { display:flex; align-items:start; justify-content:space-between; gap:18px; padding-bottom:22px; border-bottom:1px solid rgb(49 88 158 / .25); } .eyebrow { margin:0; color:var(--blue); font-size:11px; font-weight:900; letter-spacing:.13em; } h1 { margin:10px 0 0; font-size:clamp(31px,4vw,50px); line-height:1.12; letter-spacing:-.06em; } .status { padding:9px 12px; color:var(--pink-deep); border:1px solid #d96f9e; border-radius:999px; background:transparent; font-size:12px; font-weight:900; white-space:nowrap; } .task { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr); gap:34px; align-items:stretch; min-height:360px; padding:34px 0 30px; } .task-copy { display:flex; min-width:0; flex-direction:column; justify-content:center; } .task-index { margin:0 0 12px!important; color:var(--blue)!important; font-size:11px!important; font-weight:900; letter-spacing:.11em; } .task-copy h2 { margin:0 0 14px; font-size:clamp(28px,3vw,38px); line-height:1.1; letter-spacing:-.035em; } .task-copy p { max-width:570px; margin:0; color:var(--muted); font-size:17px; line-height:1.65; } .task-note { margin-top:24px!important; padding:14px 16px 14px 18px; color:var(--pink-deep)!important; border:0; border-left:3px solid var(--pink); background:linear-gradient(90deg,var(--pink-soft),transparent); font-weight:800; } .task-visual { display:flex; min-width:0; min-height:300px; flex-direction:column; padding:12px; border:2px solid #819bd0; background:linear-gradient(135deg,#eef5ff,#fff 68%,#ffeaf2); box-shadow:5px 6px 0 rgb(49 88 158 / .13),inset 2px 2px #fff; } .visual-meta { display:flex; justify-content:space-between; gap:12px; padding:2px 3px 10px; color:var(--blue); font-size:10px; font-weight:900; letter-spacing:.1em; } .task-visual img { display:block; width:100%; flex:1; min-height:0; aspect-ratio:4 / 3; object-fit:contain; border:1px solid var(--ink); background:#fff; } .task-visual figcaption { padding:9px 3px 1px; color:var(--muted); font-size:11px; line-height:1.35; } .bottom-status { display:flex; justify-content:space-between; gap:16px; padding-top:18px; border-top:1px solid rgb(49 88 158 / .25); color:var(--muted); font-size:12px; font-weight:800; } .bottom-status span:last-child { color:var(--pink-deep); } @media (max-width:760px) { body { padding:8px 0; } .screen { width:96vw; } .workspace { grid-template-columns:1fr; } .sidebar { border-right:0; border-bottom:1px solid var(--frame-dark); } .nav-item { display:inline-flex; margin:0 5px 0 0; } .work-area { padding:22px 18px; } .work-head { display:block; } .status { display:inline-block; margin-top:15px; } .task { grid-template-columns:1fr; } .task-visual { min-height:240px; } } @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
    </style>

    <main class="screen"><header class="titlebar"><span>RUSTFIELD_APP / WORKSPACE_01</span><span class="controls"><i class="control">−</i><i class="control">□</i><i class="control">×</i></span></header><section class="stage"><div class="workspace"><aside class="sidebar"><p class="brand">RUSTFIELD / LAB</p><p class="sidebar-kicker">REFERENCE WORKSPACE / 01</p><nav class="sidebar-nav" aria-label="工作区导航"><a class="nav-item active" href="#task"><span class="nav-number">01</span>当前任务</a><a class="nav-item" href="#references"><span class="nav-number">02</span>参考资料</a><a class="nav-item" href="#notes"><span class="nav-number">03</span>我的笔记</a></nav></aside><section class="work-area" id="task"><div class="work-head"><div><p class="eyebrow">WORKSPACE / CURRENT DECISION</p><h1>先建立一套，<br /><span style="background:linear-gradient(transparent 58%,var(--pink) 58% 90%,transparent 90%);">能重复使用的语言。</span></h1></div><span class="status">进行中</span></div><div class="task"><div class="task-copy"><p class="task-index">01 / CURRENT TASK · REFERENCE BREAKDOWN</p><h2>把参考变成判断。</h2><p>选择一个明确的风格锚点，再把配色、构图、节奏和镜头拆成可以继续使用的表达。</p><p class="task-note">下一步：整理一张参考图里的关键证据。</p></div><figure class="task-visual"><div class="visual-meta"><span>REFERENCE / FRAME_03</span><span>FULL FRAME</span></div><img src="../assets/reference-placeholder.svg" alt="参考图拆解工作区，完整展示配色、构图和镜头证据" /><figcaption>配色、构图、节奏与镜头：先观察关系，再添加组件。</figcaption></figure></div><div class="bottom-status"><span>01 / 当前任务</span><span>NEXT / 整理关键证据</span></div></section></div></section></main>
